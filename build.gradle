def determineVersion() {
    return project.hasProperty('revision') ? project.getProperty('revision') : project.getProperty('version')
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.6.1'
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://hub.spigotmc.org/nexus/content/repositories/snapshots/')
    }

    maven {
        url = uri('https://repo.dmulloy2.net/repository/public/')
    }

    maven {
        url = uri('https://oss.sonatype.org/content/repositories/snapshots/')
    }

    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }

    maven { url = uri('https://jitpack.io/') }
    maven { url = uri("https://repo.codemc.io/repository/maven-releases/") }
    maven { url = uri("https://repo.codemc.io/repository/avarionmc/") }
}

dependencies {
    implementation "org.bstats:bstats-bukkit:3.2.1"
    implementation "org.jetbrains:annotations:26.1.0"

    compileOnly "org.spigotmc:spigot-api:1.19-R0.1-20220725.090125-47"
    compileOnly "org.apache.commons:commons-lang3:3.20.0"
    // 1.10-1.11: no .spigot() on commandSender
    // 1.12-1.15: has no HTML colors
    // 1.16: requires Java 8/11; will not load Java 17 bytecode (this build).
    // 1.17+: minimum supported runtime — Paper/Spigot 1.17 is the lowest MC
    //        version that runs on Java 17 (1.18+ requires Java 17 by default,
    //        1.20.5+ requires Java 21+).
    compileOnly "com.github.retrooper:packetevents-spigot:2.13.0"

    implementation "org.avarion:yaml:2.2.1"

    testImplementation "org.junit.jupiter:junit-jupiter:5.13.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.13.3"
}

test {
    useJUnitPlatform()
}

version = determineVersion()
project.ext.pluginVersion = version

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}


// The plain `jar` and `shadowJar` tasks both default to the base name + empty classifier, so
// without this they write the exact same build/libs/PluginHider-<version>.jar. Whichever ran
// last won, and the thin `jar` (no shaded org.avarion:yaml) shipping would fail to load. Give
// the thin jar its own classifier so the shaded jar is the one, unambiguous deliverable.
jar {
    archiveClassifier.set('unshaded')
}

shadowJar {
    archiveBaseName.set(project.description)
    archiveClassifier.set('')
    archiveVersion.set(project.version)

    // Optional: Exclude specific files
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'

    relocate("org.bstats", "org.avarion.bstats")
}

tasks.register('deploy', Copy) {
    dependsOn shadowJar
    from shadowJar
    into file("${projectDir}/../server/plugins")
    // Only copy into a local test server when one actually exists next to the project;
    // on CI (and anyone else's checkout) there is no ../server, so skip instead of
    // creating a stray directory on every build.
    onlyIf { file("${projectDir}/../server/plugins").isDirectory() }
}

processResources {
    var props = project.properties;

    filesMatching('plugin.yml') {
        expand(props)
    }
}

tasks.deploy.dependsOn shadowJar
tasks.jar.finalizedBy deploy
